name: Test Project

on:
  pull_request:
    branches: =  main 
  push:
    branches: = main 

jobs:
  test:
    runs-on: ubuntu-latest
    container: 
      image: node:22
    steps:
        uses: actions/checkout@v3
        with:
          node-version: 22
        run: npm install
        run: npm test
        run: npm run build